<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pelleBg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1a0f0a"/>
      <stop offset="40%" stop-color="#2c1810"/>
      <stop offset="100%" stop-color="#3d2317"/>
    </linearGradient>
    <linearGradient id="pelleLight" x1="0" y1="0.3" x2="1" y2="0.7">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8B6914" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="pelleStitch" x="0" y="0" width="35" height="35" patternUnits="userSpaceOnUse">
      <line x1="17" y1="0" x2="17" y2="35" stroke="#C9A84C" stroke-opacity="0.05" stroke-width="0.8" stroke-dasharray="2,5"/>
      <line x1="0" y1="17" x2="35" y2="17" stroke="#C9A84C" stroke-opacity="0.04" stroke-width="0.8" stroke-dasharray="2,5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#pelleBg)"/>
  <rect width="800" height="600" fill="url(#pelleLight)"/>
  <rect width="800" height="600" fill="url(#pelleStitch)"/>
  <!-- Wallet silhouette -->
  <g transform="translate(260, 140)" opacity="0.1">
    <rect x="0" y="40" width="280" height="180" rx="12" fill="none" stroke="#C9A84C" stroke-width="3"/>
    <rect x="0" y="40" width="280" height="60" rx="12" fill="#C9A84C" opacity="0.3"/>
    <rect x="200" y="120" width="50" height="30" rx="8" fill="none" stroke="#C9A84C" stroke-width="3"/>
    <circle cx="225" cy="135" r="6" fill="#C9A84C"/>
    <!-- Card slots -->
    <rect x="20" y="50" width="80" height="45" rx="6" fill="none" stroke="#C9A84C" stroke-width="2"/>
    <rect x="110" y="50" width="80" height="45" rx="6" fill="none" stroke="#C9A84C" stroke-width="2"/>
    <!-- Borsello/pouch -->
    <path d="M340,120 Q340,60 400,50 Q460,60 460,120" fill="none" stroke="#C9A84C" stroke-width="3"/>
    <rect x="340" y="120" width="120" height="90" rx="10" fill="none" stroke="#C9A84C" stroke-width="3"/>
    <line x1="370" y1="165" x2="430" y2="165" stroke="#C9A84C" stroke-width="2"/>
  </g>
  <text x="400" y="520" text-anchor="middle" font-family="serif" font-size="20" fill="#C9A84C" opacity="0.2" letter-spacing="6">PELLETTERIA</text>
</svg>