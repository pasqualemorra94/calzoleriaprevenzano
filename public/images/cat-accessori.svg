<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="accessoriBg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2c1810"/>
      <stop offset="60%" stop-color="#3d2317"/>
      <stop offset="100%" stop-color="#1a0f0a"/>
    </linearGradient>
    <linearGradient id="accessoriLight" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#8B6914" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="accessoriStitch" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="25" x2="50" y2="25" stroke="#C9A84C" stroke-opacity="0.05" stroke-width="0.8" stroke-dasharray="2,8"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#accessoriBg)"/>
  <rect width="800" height="600" fill="url(#accessoriLight)"/>
  <rect width="800" height="600" fill="url(#accessoriStitch)"/>
  <!-- Accessories silhouettes -->
  <g transform="translate(250, 150)" opacity="0.1" fill="none" stroke="#C9A84C" stroke-width="3">
    <!-- Belt -->
    <rect x="0" y="120" width="300" height="40" rx="20"/>
    <rect x="130" y="110" width="40" height="60" rx="4" fill="#C9A84C"/>
    <!-- Sole/creme hints -->
    <circle cx="80" cy="60" r="30"/>
    <circle cx="220" cy="50" r="25"/>
    <!-- Brush -->
    <rect x="60" y="240" width="80" height="15" rx="4"/>
    <rect x="65" y="255" width="10" height="20" fill="#C9A84C"/>
    <rect x="80" y="255" width="10" height="25" fill="#C9A84C"/>
    <rect x="95" y="255" width="10" height="18" fill="#C9A84C"/>
    <rect x="110" y="255" width="10" height="22" fill="#C9A84C"/>
    <rect x="125" y="255" width="10" height="20" fill="#C9A84C"/>
  </g>
  <text x="400" y="520" text-anchor="middle" font-family="serif" font-size="20" fill="#C9A84C" opacity="0.2" letter-spacing="6">ACCESSORI</text>
</svg>