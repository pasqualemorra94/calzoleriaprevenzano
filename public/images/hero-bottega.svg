<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f0a"/>
      <stop offset="40%" stop-color="#2c1810"/>
      <stop offset="70%" stop-color="#3d2317"/>
      <stop offset="100%" stop-color="#1a0f0a"/>
    </linearGradient>
    <linearGradient id="leatherShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B6914" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#C9A84C" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#6B4F1D" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="stitchPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="30" x2="60" y2="30" stroke="#C9A84C" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4,8"/>
      <line x1="30" y1="0" x2="30" y2="60" stroke="#C9A84C" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="4,8"/>
    </pattern>
    <pattern id="grain" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="20" r="0.5" fill="#C9A84C" opacity="0.08"/>
      <circle cx="50" cy="80" r="0.7" fill="#C9A84C" opacity="0.05"/>
      <circle cx="120" cy="40" r="0.4" fill="#C9A84C" opacity="0.06"/>
      <circle cx="170" cy="130" r="0.6" fill="#C9A84C" opacity="0.04"/>
      <circle cx="80" cy="160" r="0.5" fill="#C9A84C" opacity="0.07"/>
      <circle cx="150" cy="90" r="0.3" fill="#C9A84C" opacity="0.06"/>
    </pattern>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <!-- Base gradient -->
  <rect width="1920" height="1080" fill="url(#heroBg)"/>
  <!-- Leather shine overlay -->
  <rect width="1920" height="1080" fill="url(#leatherShine)"/>
  <!-- Stitch pattern -->
  <rect width="1920" height="1080" fill="url(#stitchPattern)"/>
  <!-- Grain texture -->
  <rect width="1920" height="1080" fill="url(#grain)"/>
  <!-- Warm light spots -->
  <ellipse cx="400" cy="600" rx="500" ry="400" fill="#C9A84C" opacity="0.04" filter="url(#softBlur)"/>
  <ellipse cx="1400" cy="400" rx="400" ry="300" fill="#C9A84C" opacity="0.03" filter="url(#softBlur)"/>
  <!-- Subtle vignette -->
  <rect width="1920" height="1080" fill="none" stroke="#0a0503" stroke-width="300" opacity="0.3"/>
  <!-- Stitch line decorative element at bottom -->
  <line x1="100" y1="980" x2="900" y2="980" stroke="#C9A84C" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6,6"/>
  <!-- Small tools silhouette hint (workshop feel) -->
  <g transform="translate(1500, 500)" opacity="0.06" fill="#C9A84C">
    <rect x="0" y="0" width="8" height="120" rx="4" transform="rotate(-15)"/>
    <rect x="20" y="10" width="6" height="100" rx="3" transform="rotate(-5)"/>
    <rect x="35" y="5" width="7" height="110" rx="3" transform="rotate(5)"/>
    <rect x="55" y="15" width="5" height="90" rx="2" transform="rotate(10)"/>
  </g>
  <!-- Bottom text hint -->
  <text x="960" y="1040" text-anchor="middle" font-family="serif" font-size="14" fill="#C9A84C" opacity="0.15" letter-spacing="8">CALZOLERIA PREVENZANO — NAPOLI</text>
</svg>