<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sandaliBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2317"/>
      <stop offset="50%" stop-color="#2c1810"/>
      <stop offset="100%" stop-color="#1a0f0a"/>
    </linearGradient>
    <linearGradient id="sandaliLight" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B6914" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="sandaliStitch" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="40" y2="20" stroke="#C9A84C" stroke-opacity="0.07" stroke-width="0.8" stroke-dasharray="3,6"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#sandaliBg)"/>
  <rect width="800" height="600" fill="url(#sandaliLight)"/>
  <rect width="800" height="600" fill="url(#sandaliStitch)"/>
  <!-- Sandal silhouette -->
  <g transform="translate(320, 200)" opacity="0.12">
    <!-- Sole -->
    <path d="M0,180 Q40,200 80,180 L120,180 Q160,200 200,180 L240,185 Q260,188 280,180 L300,185 Q320,188 340,175 L360,180 Q380,185 400,170 L400,200 L0,200 Z" fill="#C9A84C"/>
    <!-- Upper straps -->
    <path d="M60,140 Q100,80 160,100 Q200,110 200,140" fill="none" stroke="#C9A84C" stroke-width="6" stroke-linecap="round"/>
    <path d="M160,100 Q220,70 280,90 Q320,100 320,140" fill="none" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
    <!-- Ankle strap -->
    <path d="M100,100 Q140,60 180,80" fill="none" stroke="#C9A84C" stroke-width="4" stroke-linecap="round"/>
    <!-- Thong -->
    <line x1="200" y1="140" x2="200" y2="60" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
    <circle cx="200" cy="50" r="12" fill="none" stroke="#C9A84C" stroke-width="4"/>
  </g>
  <!-- Label -->
  <text x="400" y="520" text-anchor="middle" font-family="serif" font-size="20" fill="#C9A84C" opacity="0.2" letter-spacing="6">SANDALI</text>
</svg>