<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bottegaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c1810"/>
      <stop offset="50%" stop-color="#3d2317"/>
      <stop offset="100%" stop-color="#1a0f0a"/>
    </linearGradient>
    <radialGradient id="warmLight" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#8B6914" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#1a0f0a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="woodGrain" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="100" y2="22" stroke="#C9A84C" stroke-opacity="0.04" stroke-width="0.5"/>
      <line x1="0" y1="50" x2="100" y2="48" stroke="#C9A84C" stroke-opacity="0.03" stroke-width="0.5"/>
      <line x1="0" y1="80" x2="100" y2="82" stroke="#C9A84C" stroke-opacity="0.05" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bottegaBg)"/>
  <rect width="800" height="600" fill="url(#warmLight)"/>
  <rect width="800" height="600" fill="url(#woodGrain)"/>
  <!-- Shelf silhouettes (bottega interior feel) -->
  <g opacity="0.08" fill="#C9A84C">
    <!-- Shelves -->
    <rect x="80" y="120" width="250" height="8" rx="2"/>
    <rect x="80" y="220" width="250" height="8" rx="2"/>
    <rect x="80" y="320" width="250" height="8" rx="2"/>
    <rect x="450" y="150" width="280" height="8" rx="2"/>
    <rect x="450" y="270" width="280" height="8" rx="2"/>
    <!-- Items on shelves -->
    <rect x="100" y="60" width="40" height="60" rx="4"/>
    <rect x="150" y="80" width="35" height="40" rx="4"/>
    <rect x="200" y="50" width="45" height="70" rx="4"/>
    <rect x="260" y="70" width="38" height="50" rx="4"/>
    <rect x="470" y="90" width="50" height="60" rx="4"/>
    <rect x="540" y="100" width="40" height="50" rx="4"/>
    <rect x="600" y="80" width="45" height="70" rx="4"/>
    <rect x="660" y="95" width="42" height="55" rx="4"/>
    <!-- Counter -->
    <rect x="300" y="380" width="500" height="20" rx="4"/>
    <rect x="300" y="400" width="500" height="200" rx="0" opacity="0.5"/>
  </g>
  <!-- Stitch decorative line -->
  <line x1="100" y1="560" x2="700" y2="560" stroke="#C9A84C" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="400" y="585" text-anchor="middle" font-family="serif" font-size="11" fill="#C9A84C" opacity="0.12" letter-spacing="5">VIA CHIAIA 104 — NAPOLI</text>
</svg>